# VORÜBERGEHEND (nur im PR, wird vor dem Merge gelöscht): spielt das Update vom damaligen „latest“ (0.1.0-ci.57,
# Artifact von Lauf 39592756804) auf v0.1.0 und auf v0.1.1 nach und zeigt, welche Dateien danach fehlen.
name: Diagnose MSI-Update
on: pull_request
permissions:
  contents: read
  actions: read
jobs:
  diag:
    runs-on: windows-latest
    steps:
      - name: Updates nachspielen
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $repo = $env:GITHUB_REPOSITORY
          gh run download 39592756804 -R $repo -n Pakete-windows -D ci
          gh release download v0.1.0 -R $repo -p 'Lupe-0.1.0-x64.msi' -D v010
          gh release download v0.1.1 -R $repo -p 'Lupe-0.1.1-x64.msi' -D v011
          $installer = New-Object -ComObject WindowsInstaller.Installer
          function Related { @(foreach ($product in $installer.RelatedProducts('{B5E63BC4-65DB-46E9-B6B1-5A3167B381D1}')) { $product }) }
          function Msi([string] $action, [string] $item) {
            $p = Start-Process msiexec.exe -ArgumentList $action, "`"$item`"", '/qn' -Wait -PassThru
            Write-Host "msiexec $action $(Split-Path $item -Leaf): Exitcode $($p.ExitCode)"
          }
          function Files { @(Get-ChildItem "$env:ProgramFiles\Lupe" -Recurse -File -ErrorAction SilentlyContinue |
            ForEach-Object { "$($_.Name) [$($_.VersionInfo.FileVersion)]" } | Sort-Object) }
          foreach ($case in @(@('ci\Lupe-x64.msi', 'v010\Lupe-0.1.0-x64.msi'), @('ci\Lupe-x64.msi', 'v011\Lupe-0.1.1-x64.msi'), @('v010\Lupe-0.1.0-x64.msi', 'v011\Lupe-0.1.1-x64.msi'))) {
            Write-Host "===== $($case[0]) -> $($case[1])"
            Msi '/i' (Resolve-Path $case[0]).Path
            $before = Files
            Write-Host "vorher: $($before.Count) Dateien"; $before | Write-Host
            Msi '/i' (Resolve-Path $case[1]).Path
            $after = Files
            Write-Host "nachher: $($after.Count) Dateien, Produkte: $(@(Related).Count)"; $after | Write-Host
            $beforeNames = $before | ForEach-Object { ($_ -split ' ')[0] }
            $afterNames = $after | ForEach-Object { ($_ -split ' ')[0] }
            $missing = @($beforeNames | Where-Object { $_ -notin $afterNames })
            if ($missing) { Write-Host "::warning::$($case[0]) -> $($case[1]): FEHLEN $($missing -join ', ')" }
            else { Write-Host "$($case[0]) -> $($case[1]): nichts fehlt" }
            foreach ($product in @(Related)) { Msi '/x' $product }
          }
