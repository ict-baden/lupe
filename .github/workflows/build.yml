name: Build

# Wann wie viel gebaut wird, steht in docs/development.md („CI and releases“). Kurz: Pushs und PRs bauen nur den
# billigen Linux-Teil (version, zxing-cpp x64, Build und Tests unter Linux), den vollen Build (Windows, macOS, ARM,
# Pakete, Rauchtests, Releases) gibt es nachts (nur wenn main neu ist), bei Tags, von Hand, mit [voll] in der
# Commit-Nachricht und bei PRs mit Label voll-bauen oder Pfaden aus FULL_PATHS (Job gate). Reine Doku startet nichts.
on:
  push:
    branches: [main]
    tags: ['v*'] # Pfadfilter gelten für Tags nicht, ein Tag baut immer
    paths-ignore: ['**.md', 'docs/**', 'LICENSE', '.github/ISSUE_TEMPLATE/**']
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths-ignore: ['**.md', 'docs/**', 'LICENSE', '.github/ISSUE_TEMPLATE/**']
  schedule:
    - cron: '35 2 * * *' # Minute je Repo anders, damit nicht alle gleichzeitig starten
  workflow_dispatch:

# Nur lesen; Schreibrechte bekommen die Jobs, die sie brauchen (release: Releases, windows: Anmeldung bei Azure)
permissions:
  contents: read

# Läufe auf demselben Branch nacheinander, damit sich die 'latest'-Releases nicht überholen.
# In PRs bricht ein neuer Push den alten Lauf ab.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  # Avalonia schickt beim Build sonst Nutzungsdaten (Avalonia.BuildServices, AvaloniaStatsTask)
  AVALONIA_TELEMETRY_OPTOUT: '1'
  # Signieren nur, wenn die Organisation Artifact Signing eingerichtet hat (siehe docs/development.md, „CI and releases“)
  # und nicht bei Pull Requests (dort gibt es kein OIDC-Token mit den nötigen Rechten). Bis dahin unsigniert.
  SIGN: ${{ vars.SIGNING_ACCOUNT != '' && github.event_name != 'pull_request' }}

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ steps.gate.outputs.run }}
      full: ${{ steps.gate.outputs.full }}
    steps:
      - name: Umfang bestimmen
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          MSG: ${{ github.event.head_commit.message }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          PR: ${{ github.event.pull_request.number }}
          # Geänderte Dateien, bei denen ein PR die volle Matrix braucht. Je Repo anpassen.
          # Lupe: Installer, Pakete (alle Plattformen, die Paketprüfungen laufen nur im vollen Build), Windows- und
          # macOS-Anbindung, der Windows-Teil der App (LUPE_WINDOWS, Interop) und alles, was Abhängigkeiten oder SDK ändert
          FULL_PATHS: '^(\.github/|installer/|packaging/|src/Lupe\.Platform\.(Windows|MacOS)/|src/Lupe/(Program\.cs|app\.manifest|Interop/)|Directory\.Build\.props$|global\.json$|THIRD-PARTY-NOTICES\.txt$)|\.csproj$'
          # Reine Doku, wie paths-ignore oben
          DOC_PATHS: '(\.md$|^docs/|^LICENSE$|^\.github/ISSUE_TEMPLATE/)'
        run: |
          set -euo pipefail
          run=true; full=false
          case "$EVENT" in
            workflow_dispatch) full=true ;;
            push)
              # Bei mehreren Commits in einem Push zählt die Nachricht des letzten
              if [ "$GITHUB_REF_TYPE" = tag ] || [[ "$MSG" == *"[voll]"* ]]; then full=true; fi ;;
            pull_request)
              files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[].filename')
              if [[ ",$LABELS," == *",voll-bauen,"* ]] || grep -qE "$FULL_PATHS" <<< "$files"; then full=true; fi ;;
            schedule)
              # Der Tag 'latest' steht auf dem Commit des letzten vollen Builds von main
              built=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/latest" --jq .object.sha 2>/dev/null || true)
              if [ "$built" = "$GITHUB_SHA" ]; then
                run=false
              else
                # Scheitert der Vergleich (kein 'latest', Verlauf umgeschrieben), wird voll gebaut
                changed=$(gh api "repos/$GITHUB_REPOSITORY/compare/$built...$GITHUB_SHA" --jq '.files[].filename' 2>/dev/null || echo '?')
                if [ -n "$built" ] && ! grep -qvE "$DOC_PATHS" <<< "$changed"; then run=false; else full=true; fi # sonst nur Doku
              fi ;;
          esac
          echo "Ereignis: $EVENT  run=$run  full=$full"
          { echo "run=$run"; echo "full=$full"; } >> "$GITHUB_OUTPUT"

  version:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    # Ein hängender Schritt soll nicht bis zum GitHub-Limit von 6 Stunden laufen
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      msi: ${{ steps.version.outputs.msi }}
      suffix: ${{ steps.version.outputs.suffix }}
      file: ${{ steps.version.outputs.file }}
    steps:
      - uses: actions/checkout@v7

      - name: PowerShell-Syntax (alle Workflow-Schritte und Skripte)
        # Auch die Schritte, die nur bei Tags oder auf main laufen: Typografische Anführungszeichen in einem PowerShell-Text
        # beenden ihn (ParserError) – im PR fiel das nicht auf, erst im Release-Job. Hier zuerst: Die Jobs windows, linux
        # und macos warten auf diesen Job und starten bei einem Fehler gar nicht.
        run: |
          python3 -m pip install --quiet pyyaml
          python3 .github/scripts/ps-syntax.py > "$RUNNER_TEMP/ps-blocks.json"
          pwsh -NoProfile -File .github/scripts/ps-syntax.ps1 -Blocks "$RUNNER_TEMP/ps-blocks.json" -Root .github,tools

      - name: Version bestimmen
        id: version
        shell: pwsh
        run: |
          # Tag v1.2.3 -> 1.2.3, sonst Version aus der csproj mit Build-Nummer
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $v = $env:GITHUB_REF_NAME -replace '^v', ''
          } else {
            $base = ([xml](Get-Content src/Lupe/Lupe.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
            $v = "$base-ci.$env:GITHUB_RUN_NUMBER"
          }
          # MSI kennt nur Zahlen. CI-Builds: Version aus der csproj + Lauf-Nummer als 4. Stelle (z. B. 0.1.0.12).
          # Windows Installer vergleicht nur drei Stellen, deshalb ersetzen sich CI-Builds gegenseitig
          # (AllowSameVersionUpgrades), und ein Release v0.1.1 ist immer neuer als jeder 0.1.0-CI-Build.
          $core = $v -replace '[-+].*$', ''
          $msi = if ($env:GITHUB_REF_TYPE -eq 'tag') { $core } else { "$core.$env:GITHUB_RUN_NUMBER" }
          # Dateiversion der Programmdateien immer mit Lauf-Nummer, auch beim Tag (0.1.2.70): Windows Installer ersetzt
          # beim Update nur Dateien mit höherer Version. Mit x.y.z.0 im Tag-Release war die Exe gleich alt wie im
          # CI-Build davor (latest), und ein Update ließ die alte stehen. Die Lauf-Nummer steigt immer (höchstens 65535
          # in der vierten Stelle; ein umbenannter Workflow finge wieder bei 1 an).
          $file = "$core.$env:GITHUB_RUN_NUMBER"
          if ([int]$env:GITHUB_RUN_NUMBER -gt 65535) { throw "Lauf-Nummer $env:GITHUB_RUN_NUMBER passt nicht in die Dateiversion (höchstens 65535)" }
          # Dateinamen: Releases aus einem Tag mit Version (Lupe-1.2.3-x64.msi), sonst fest (Lupe-x64.msi), damit die
          # Links auf 'latest' dauerhaft gelten – die Version steht dort im Release-Text
          $suffix = if ($env:GITHUB_REF_TYPE -eq 'tag') { "-$v" } else { '' }
          "version=$v" >> $env:GITHUB_OUTPUT
          "msi=$msi" >> $env:GITHUB_OUTPUT
          "suffix=$suffix" >> $env:GITHUB_OUTPUT
          "file=$file" >> $env:GITHUB_OUTPUT
          Write-Host "Version: $v  MSI: $msi  Dateiversion: $file  Dateien: Lupe$suffix-x64.msi"

      - name: Release-Text prüfen (nur bei Tag v*)
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          # Gleich hier statt erst im Release-Job nach allen Builds: fehlt der Abschnitt im CHANGELOG, bricht das Skript ab
          ./.github/scripts/release-notes.ps1 -Tag $env:GITHUB_REF_NAME -Version '${{ steps.version.outputs.version }}' `
            -Suffix '${{ steps.version.outputs.suffix }}' | Out-Null

  # Native zxing-cpp-Bibliothek selbst gebaut (packaging/zxing): Die aus dem NuGet-Paket ZXingCpp braucht glibc 2.38,
  # macOS 26 bzw. die VC++-Laufzeit. Gebaut wird sie nur, wenn sich Version oder Skript ändern (Zwischenspeicher);
  # geprüft wird sie bei jedem Lauf.
  # Je Plattform ein eigener Job, damit Windows und Linux nicht auf einen freien macOS-Runner warten.
  zxing-linux:
    name: zxing-cpp (${{ matrix.name }})
    needs: gate
    if: needs.gate.outputs.run == 'true'
    strategy:
      fail-fast: false
      matrix:
        # arm64 (ARM-Runner) nur im vollen Build, der Linux-Teil braucht nur x64
        include: ${{ fromJSON(needs.gate.outputs.full == 'true' && '[{"name":"linux-x64","os":"ubuntu-latest","rids":"linux-x64"},{"name":"linux-arm64","os":"ubuntu-24.04-arm","rids":"linux-arm64"}]' || '[{"name":"linux-x64","os":"ubuntu-latest","rids":"linux-x64"}]') }}
    runs-on: ${{ matrix.os }}
    # Ein hängender Schritt soll nicht bis zum GitHub-Limit von 6 Stunden laufen
    # Ohne Cache baut zxing-cpp neu
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Zwischenspeicher
        id: cache
        uses: actions/cache@v6
        with:
          path: zxing
          key: zxing-${{ matrix.name }}-${{ hashFiles('packaging/zxing/build.sh', 'packaging/zxing/versions.env') }}

      - name: Bauen
        if: steps.cache.outputs.cache-hit != 'true'
        shell: bash
        env:
          ZXING_WORK_BASE: ${{ runner.temp }}
        run: |
          for rid in ${{ matrix.rids }}; do
            ZXING_WORK="$ZXING_WORK_BASE/zxing-$rid" packaging/zxing/build.sh "$rid" zxing
          done

      - name: dumpbin bereitstellen
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" | Select-Object -First 1
          $dumpbin.DirectoryName >> $env:GITHUB_PATH

      - name: Prüfen (glibc, macOS-Mindestversion, keine VC++-Laufzeit, Exporte)
        shell: bash
        run: |
          for rid in ${{ matrix.rids }}; do
            packaging/zxing/check.sh "$rid" "$(ls zxing/$rid/*ZXing.*)"
          done

      - uses: actions/upload-artifact@v7
        with:
          name: zxing-${{ matrix.name }}
          path: zxing/
          if-no-files-found: error
          retention-days: 1

  zxing-macos:
    name: zxing-cpp (${{ matrix.name }})
    needs: gate
    if: needs.gate.outputs.full == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macos, os: macos-latest, rids: osx-arm64 osx-x64 }
    runs-on: ${{ matrix.os }}
    # Ein hängender Schritt soll nicht bis zum GitHub-Limit von 6 Stunden laufen
    # Ohne Cache baut zxing-cpp neu (zwei Architekturen)
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Zwischenspeicher
        id: cache
        uses: actions/cache@v6
        with:
          path: zxing
          key: zxing-${{ matrix.name }}-${{ hashFiles('packaging/zxing/build.sh', 'packaging/zxing/versions.env') }}

      - name: Bauen
        if: steps.cache.outputs.cache-hit != 'true'
        shell: bash
        env:
          ZXING_WORK_BASE: ${{ runner.temp }}
        run: |
          for rid in ${{ matrix.rids }}; do
            ZXING_WORK="$ZXING_WORK_BASE/zxing-$rid" packaging/zxing/build.sh "$rid" zxing
          done

      - name: dumpbin bereitstellen
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" | Select-Object -First 1
          $dumpbin.DirectoryName >> $env:GITHUB_PATH

      - name: Prüfen (glibc, macOS-Mindestversion, keine VC++-Laufzeit, Exporte)
        shell: bash
        run: |
          for rid in ${{ matrix.rids }}; do
            packaging/zxing/check.sh "$rid" "$(ls zxing/$rid/*ZXing.*)"
          done

      - uses: actions/upload-artifact@v7
        with:
          name: zxing-${{ matrix.name }}
          path: zxing/
          if-no-files-found: error
          retention-days: 1

  zxing-windows:
    name: zxing-cpp (${{ matrix.name }})
    needs: gate
    if: needs.gate.outputs.full == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows, os: windows-latest, rids: win-x64 }
    runs-on: ${{ matrix.os }}
    # Ein hängender Schritt soll nicht bis zum GitHub-Limit von 6 Stunden laufen
    # Ohne Cache baut zxing-cpp neu
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Zwischenspeicher
        id: cache
        uses: actions/cache@v6
        with:
          path: zxing
          key: zxing-${{ matrix.name }}-${{ hashFiles('packaging/zxing/build.sh', 'packaging/zxing/versions.env') }}

      - name: Bauen
        if: steps.cache.outputs.cache-hit != 'true'
        shell: bash
        env:
          ZXING_WORK_BASE: ${{ runner.temp }}
        run: |
          for rid in ${{ matrix.rids }}; do
            ZXING_WORK="$ZXING_WORK_BASE/zxing-$rid" packaging/zxing/build.sh "$rid" zxing
          done

      - name: dumpbin bereitstellen
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" | Select-Object -First 1
          $dumpbin.DirectoryName >> $env:GITHUB_PATH

      - name: Prüfen (glibc, macOS-Mindestversion, keine VC++-Laufzeit, Exporte)
        shell: bash
        run: |
          for rid in ${{ matrix.rids }}; do
            packaging/zxing/check.sh "$rid" "$(ls zxing/$rid/*ZXing.*)"
          done

      - uses: actions/upload-artifact@v7
        with:
          name: zxing-${{ matrix.name }}
          path: zxing/
          if-no-files-found: error
          retention-days: 1

  windows:
    needs: [gate, version, zxing-windows]
    if: needs.gate.outputs.full == 'true'
    runs-on: windows-latest
    # Ein hängender Schritt soll nicht 6 Stunden blockieren (üblich sind 10–15 min)
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write # für die Anmeldung bei Azure Artifact Signing (OIDC)
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/download-artifact@v8
        with:
          name: zxing-windows
          path: zxing

      - name: Restore
        run: dotnet restore Lupe.sln

      - name: Build
        run: dotnet build Lupe.sln -c Release --no-restore

      - name: Tests
        # Tests, die eine Webcam oder einen sichtbaren Desktop brauchen, überspringen sich selbst.
        # Beide Test-Ziele nacheinander: parallel bremsen sie sich gegenseitig, und die Echtzeit-Tests verpassen ihre Zeitfenster
        run: dotnet test Lupe.sln -c Release --no-build -p:TestTfmsInParallel=false --blame-hang-timeout 4m --blame-hang-dump-type none --logger "trx;LogFileName=tests.trx" --results-directory TestResults

      - name: Testergebnisse
        if: always()
        # Ein Upload-Problem (z. B. voller Artifact-Speicher) soll Publish und Release nicht blockieren
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: Testergebnisse-windows
          path: TestResults/*.trx
          if-no-files-found: ignore
          retention-days: 3

      # ---- Signieren (vor dem Packen, damit ZIP und MSI signierte Dateien enthalten) ----
      - name: Bei Azure anmelden
        if: env.SIGN == 'true'
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: ZXing.dll signieren (selbst gebaut)
        if: env.SIGN == 'true'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\zxing\win-x64
          files-folder-filter: dll
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Screenshots der Doku rendern
        # Wie tools/screenshots/make-assets.ps1 (ohne Banner): jede Seite hell und dunkel, englisch für die Doku, deutsch
        # zusätzlich (docs/assets/screenshots/de). Prüft nebenbei, dass jede Seite zeichnet; die Bilder liegen einen Tag als
        # Artifact zum Übernehmen bereit.
        shell: pwsh
        run: |
          $exe = 'src/Lupe/bin/Release/net10.0-windows10.0.19041.0/Lupe.exe'
          foreach ($lang in 'en', 'de') {
            $env:LUPE_LANGUAGE = $lang
            $p = Start-Process $exe -ArgumentList '--screenshots', "`"$PWD\screenshots\$lang`"" -Wait -PassThru -NoNewWindow
            if ($p.ExitCode -ne 0) { throw "Screenshots ($lang): Exitcode $($p.ExitCode)" }
          }
          Get-ChildItem screenshots -Recurse -File | Format-Table FullName, Length

      - name: Screenshots hochladen
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: Screenshots
          path: screenshots/
          if-no-files-found: error
          retention-days: 1

      - name: Publish
        shell: pwsh
        run: |
          $v = '${{ needs.version.outputs.version }}'
          # ZXing.dll aus dem Job zxing statt aus dem NuGet-Paket (statische C/C++-Laufzeit, keine VC++-Laufzeit nötig)
          $common = @('src/Lupe/Lupe.csproj', '-c', 'Release', '-r', 'win-x64', '-p:PublishSingleFile=true', "-p:Version=$v", '-p:FileVersion=${{ needs.version.outputs.file }}', '-p:DebugType=none', "-p:LupeZXingDir=$PWD/zxing")
          # Benötigt .NET 10 Runtime auf dem Zielgerät
          dotnet publish @common --self-contained false -o out/framework
          # Ohne Runtime-Abhängigkeit, Grundlage für die MSI
          dotnet publish @common --self-contained true -o out/self-contained
          # Eine einzige Exe zum Direkt-Download: Runtime und native DLLs (Skia, HarfBuzz, ZXing) eingebettet
          dotnet publish @common --self-contained true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o out/standalone

      - name: Exe signieren (framework)
        if: env.SIGN == 'true'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\out\framework
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Exe signieren (self-contained, für die MSI)
        if: env.SIGN == 'true'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\out\self-contained
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Exe signieren (Einzeldatei)
        if: env.SIGN == 'true'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\out\standalone
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Pakete schnüren
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item README.md out/framework/
          Compress-Archive -Path out/framework/* -DestinationPath "dist/Lupe${{ needs.version.outputs.suffix }}-win-x64-framework.zip"
          Copy-Item out/standalone/Lupe.exe dist/Lupe.exe

      - name: MSI bauen
        shell: pwsh
        run: |
          # Self-contained: läuft ohne installierte .NET-Runtime
          dotnet build installer/Lupe.Installer.wixproj -c Release "-p:PublishDir=$PWD/out/self-contained/" -p:ProductVersion=${{ needs.version.outputs.msi }}
          Copy-Item installer/bin/Release/Lupe.msi "dist/Lupe${{ needs.version.outputs.suffix }}-x64.msi"
          Get-ChildItem dist | Format-Table Name, Length

      - name: dumpbin bereitstellen
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" | Select-Object -First 1
          $dumpbin.DirectoryName >> $env:GITHUB_PATH

      - name: Pakete prüfen (keine VC++-Laufzeit, Rauchtest)
        shell: bash
        run: |
          # Die ausgelieferte ZXing.dll ist die selbst gebaute, und keine native Datei braucht die VC++-Laufzeit
          cmp zxing/win-x64/ZXing.dll out/framework/ZXing.dll
          cmp zxing/win-x64/ZXing.dll out/self-contained/ZXing.dll
          packaging/check-natives.sh win-x64 out/framework
          # Jede mitgelieferte Bibliothek steht in THIRD-PARTY-NOTICES.txt (deps.json der Einzeldatei liegt unter obj/)
          python packaging/check-notices.py src/Lupe/obj/Release/net10.0-windows10.0.19041.0/win-x64/Lupe.deps.json out/self-contained
          # Lupe liest einen Code: ZIP-Variante, einzelne Exe (Bibliotheken eingebettet), Self-contained (Grundlage der MSI)
          packaging/smoke.sh out/framework/Lupe.exe
          packaging/smoke.sh dist/Lupe.exe
          packaging/smoke.sh out/self-contained/Lupe.exe

      - name: MSI installieren, Updates von latest und von der letzten Version, deinstallieren
        shell: pwsh
        timeout-minutes: 20
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $msi = (Get-ChildItem dist/*.msi).FullName
          $version = '${{ needs.version.outputs.version }}'
          $fileVersion = '${{ needs.version.outputs.file }}'
          $build = [version]((('${{ needs.version.outputs.msi }}' -split '\.')[0..2]) -join '.')
          $upgradeCode = '{B5E63BC4-65DB-46E9-B6B1-5A3167B381D1}'
          $target = "$env:ProgramFiles\Lupe"
          $installer = New-Object -ComObject WindowsInstaller.Installer
          # Produktcodes aller installierten Lupe-Pakete (wie in docs/installation.md beim stillen Deinstallieren)
          function Related { @(foreach ($product in $installer.RelatedProducts($upgradeCode)) { $product }) }
          # Startet ein Programm und wartet höchstens $seconds; hängt es, zeigt das Log, was läuft, statt still zu warten.
          # Gibt den Exitcode zurück.
          function Start-Bounded([string] $file, [string[]] $arguments, [int] $seconds, [string] $what, [string] $log = '', [string] $stdout = '') {
            $params = @{ FilePath = $file; ArgumentList = $arguments; PassThru = $true }
            if ($stdout) { $params.RedirectStandardOutput = $stdout; $params.NoNewWindow = $true }
            $p = Start-Process @params
            $null = $p.Handle # sonst fehlt der Exitcode, wenn der Prozess schon beendet ist
            if (-not $p.WaitForExit($seconds * 1000)) {
              Write-Host "::error::${what} hängt (über $seconds s)"
              Get-CimInstance Win32_Process | Where-Object Name -match 'msiexec|Lupe|bash' |
                Format-Table ProcessId, ParentProcessId, Name, CommandLine -AutoSize | Out-String -Width 400 | Write-Host
              if ($log -and (Test-Path $log)) { Get-Content $log -Tail 60 | Write-Host }
              Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
              throw "${what} hängt"
            }
            $p.WaitForExit()
            $p.ExitCode
          }
          function Invoke-Msi([string] $action, [string] $item, [string] $what, [string] $log) {
            $code = Start-Bounded msiexec.exe @($action, "`"$item`"", '/qn', '/l*v', $log) 600 $what $log
            if ($code -ne 0) { Get-Content $log -Tail 40 | Write-Host; throw "${what}: Exitcode $code" }
          }
          function Remove-All {
            foreach ($product in @(Related)) { Invoke-Msi '/x' $product "Deinstallation $product" 'msi-uninstall.log' }
            if (@(Related).Count -ne 0) { throw 'Nach der Deinstallation ist noch ein Lupe-Produkt registriert' }
            if (Test-Path "$target\Lupe.exe") { throw 'Lupe.exe ist nach der Deinstallation noch da' }
          }
          # Nach jeder Installation und jedem Update muss jede Datei des Publish-Ordners (ohne .pdb, wie im MSI) genau so
          # installiert sein – verglichen über die Prüfsumme. Windows Installer ersetzt beim Update nur Dateien mit höherer
          # Version: Eine gleich alte bleibt stehen (0.1.0-ci.57 -> v0.1.0 behielt die Exe des CI-Builds), eine neuere kann
          # ganz fehlen. Deshalb trägt Lupes Dateiversion die Lauf-Nummer, und das MSI ersetzt auch gleich alte Dateien
          # (REINSTALLMODE=emus, für Fremd-DLLs mit neuem Inhalt bei gleicher Version); beides prüft dieser Vergleich.
          $source = (Resolve-Path out/self-contained).Path
          $expected = @(Get-ChildItem $source -Recurse -File | Where-Object Extension -ne '.pdb' |
            ForEach-Object { [IO.Path]::GetRelativePath($source, $_.FullName) })
          function Test-Installed([string] $what) {
            $products = @(Related)
            if ($products.Count -ne 1) { throw "${what}: $($products.Count) Lupe-Produkte statt einem - die alte Version wurde nicht ersetzt" }
            $missing = @($expected | Where-Object { -not (Test-Path -LiteralPath (Join-Path $target $_)) })
            if ($missing) { throw "${what}: Dateien fehlen: $($missing -join ', ')" }
            $stale = @($expected | Where-Object {
              (Get-FileHash -LiteralPath (Join-Path $target $_)).Hash -ne (Get-FileHash -LiteralPath (Join-Path $source $_)).Hash })
            if ($stale) { throw "${what}: nicht die neuen Dateien (alte stehen geblieben?): $($stale -join ', ')" }
            $exeVersion = (Get-Item "$target\Lupe.exe").VersionInfo.FileVersion
            if ($exeVersion -ne $fileVersion) { throw "${what}: Lupe.exe hat die Dateiversion $exeVersion statt $fileVersion" }
            $code = Start-Bounded "$target\Lupe.exe" @('--version') 60 "${what}: Lupe.exe --version" -stdout installed-version.txt
            $reported = (Get-Content installed-version.txt -Raw).Trim()
            if ($code -ne 0 -or $reported -notmatch [regex]::Escape(" $version ")) { throw "${what}: Lupe.exe meldet nicht ${version}: $reported" }
            # Git Bash ausdrücklich: „bash“ allein kann unter Windows die WSL-Bash sein
            $code = Start-Bounded "$env:ProgramFiles\Git\bin\bash.exe" @('packaging/smoke.sh', "`"$target\Lupe.exe`"") 180 "${what}: Rauchtest" -stdout smoke.txt
            Get-Content smoke.txt | Write-Host
            if ($code -ne 0) { throw "${what}: Rauchtest der installierten Lupe fehlgeschlagen" }
            Write-Host "${what}: ok - $($expected.Count) Dateien, Lupe.exe $exeVersion, $reported"
          }
          function Test-Update([string] $what, [string] $oldMsi) {
            Invoke-Msi '/i' $oldMsi "Installation $what" 'msi-old.log'
            $old = @(Related)
            if ($old.Count -ne 1) { throw "Nach der Installation $what $($old.Count) Lupe-Produkte" }
            # Ist die alte Exe nicht älter als diese (erneut gestarteter älterer Lauf, latest gerade ausgetauscht), bliebe
            # sie zu Recht stehen bzw. das Update wäre ein Downgrade – dann nicht prüfen
            $oldExe = (Get-Item "$target\Lupe.exe").VersionInfo.FileVersion
            if ([version]$oldExe -ge [version]$fileVersion) {
              Write-Host "::warning::$what hat Lupe.exe $oldExe, nicht älter als dieser Lauf ($fileVersion) - Update nicht geprüft."
              Remove-All
              return
            }
            Invoke-Msi '/i' $msi "Update von $what" 'msi-update.log'
            if (@(Related)[0] -eq $old[0]) { throw "Das neue MSI hat $what nicht ersetzt ($($old[0]))" }
            Test-Installed "Update von $what"
            Remove-All
          }

          Invoke-Msi '/i' $msi 'Neuinstallation' 'msi-install.log'
          Test-Installed 'Neuinstallation'
          Remove-All

          # Update vom neuesten Build aus „latest“ (bei einem Tag: der Build von main kurz davor, gleiche Basisversion)
          # Fehlt latest gerade (ein anderer Lauf tauscht die Dateien aus) oder in einem neuen Repo: Warnung statt Abbruch
          $latest = gh release view latest -R $env:GITHUB_REPOSITORY --json name -q '.name'
          if ($LASTEXITCODE -ne 0) { Write-Host '::warning::Release latest nicht abfragbar - Update von latest nicht geprüft.' }
          elseif ($latest -match '(\d+\.\d+\.\d+)-ci\.\d+' -and [version]$Matches[1] -le $build) {
            $from = $Matches[0]
            gh release download latest -R $env:GITHUB_REPOSITORY -p 'Lupe-x64.msi' -D from-latest
            if ($LASTEXITCODE -ne 0) { Write-Host '::warning::MSI aus latest nicht ladbar - Update von latest nicht geprüft.' }
            else { Test-Update "latest ($from)" (Resolve-Path from-latest/Lupe-x64.msi).Path }
          }
          else { Write-Host "::warning::latest ($latest) ist neuer als $build oder ohne Version - Update von latest nicht geprüft." }

          # Update von der letzten Version bis zu dieser (ohne Vorabversionen) – auch über die Sprache des Pakets hinweg
          # (bis 0.1.0 de-DE, MajorUpgrade IgnoreLanguage). Ältere Zweige testen gegen die letzte Version darunter.
          $tags = gh release list -R $env:GITHUB_REPOSITORY --exclude-pre-releases --exclude-drafts --limit 100 --json tagName -q '.[].tagName'
          if ($LASTEXITCODE -ne 0) { throw 'Die Releases ließen sich nicht abfragen' }
          $previous = $tags | Where-Object { $_ -match '^v\d+\.\d+\.\d+$' -and [version]($_.Substring(1)) -le $build } |
            Sort-Object { [version]($_.Substring(1)) } -Descending | Select-Object -First 1
          if (-not $previous) {
            # Neues Repo ohne eigene Version (z. B. vor dem ersten Tag): MSIs früherer Versionen aus der Vorabversion
            # "altversionen" (Tag außerhalb von v*, startet keinen Lauf, steht nicht in der Liste oben). Ohne sie bricht
            # ein Tag ab - sonst ginge genau das Update der vorhandenen Installationen ungeprüft hinaus.
            gh release view altversionen -R $env:GITHUB_REPOSITORY --json tagName -q '.tagName' | Out-Null
            if ($LASTEXITCODE -eq 0) {
              gh release download altversionen -R $env:GITHUB_REPOSITORY -p '*.msi' -D from-old
              if ($LASTEXITCODE -ne 0) { throw 'MSIs aus altversionen ließen sich nicht laden' }
              $oldMsis = @(Get-ChildItem from-old/*.msi)
              if ($oldMsis.Count -eq 0) { throw 'Die Vorabversion altversionen enthält kein MSI' }
              foreach ($oldMsi in $oldMsis) { Test-Update "altversionen ($($oldMsi.Name))" $oldMsi.FullName }
            }
            elseif ($env:GITHUB_REF_TYPE -eq 'tag') { throw "Keine veröffentlichte Version bis $build und keine Vorabversion altversionen - ein Tag braucht den Update-Test." }
            else { Write-Host "::warning::Keine veröffentlichte Version bis $build - Update von einer Version nicht geprüft." }
          }
          else {
            gh release download $previous -R $env:GITHUB_REPOSITORY -p '*-x64.msi' -D from-release
            if ($LASTEXITCODE -ne 0) { throw "MSI von $previous ließ sich nicht laden" }
            Test-Update $previous (Get-ChildItem from-release/*.msi).FullName
          }

      - name: MSI signieren
        if: env.SIGN == 'true'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\dist
          files-folder-filter: msi
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - uses: actions/upload-artifact@v7
        with:
          name: Pakete-windows
          path: dist/*
          if-no-files-found: error
          # Der Release-Job holt sie sofort ab; länger aufbewahrt sprengen sie den Artifact-Speicher (Free-Plan: 500 MB)
          retention-days: 1

  # Läuft bei jedem Push und PR (Build und Tests unter Xvfb). Pakete, SBOM und Rauchtests nur im vollen Build: Sie
  # brauchen zxing-cpp für arm64 (ARM-Runner) und gehen in die Releases.
  linux:
    needs: [gate, version, zxing-linux]
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    # Ein hängender Schritt soll nicht bis zum GitHub-Limit von 6 Stunden laufen
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/download-artifact@v8
        with:
          pattern: zxing-linux-*
          path: zxing
          merge-multiple: true

      - name: Pakete für Tests
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends xvfb xauth libx11-6 libxtst6 libxrandr2 libxi6 libice6 libsm6 libfontconfig1

      - name: Build
        run: dotnet build tests/Lupe.Tests -c Release -f net10.0

      - name: Tests (unter Xvfb)
        # Plattformneutrale Tests, die Avalonia-Oberfläche ohne Bildschirm und die X11-Tests (XGetImage, XTest, XGrabKey).
        # Wie unter macOS: ein hängender Test bricht nach 4 min ab und wird benannt (ein Lauf hing sonst unbegrenzt)
        timeout-minutes: 20
        run: xvfb-run -a -s "-screen 0 1280x1024x24" dotnet test tests/Lupe.Tests -c Release -f net10.0 --no-build --blame-hang-timeout 4m --blame-hang-dump-type none --logger "console;verbosity=normal" --logger "trx;LogFileName=tests-linux.trx" --results-directory TestResults

      - name: Windows-Ziel übersetzen (ohne Tests)
        # Die Nur-Windows-Tests (App/, Screen/ …) und der LUPE_WINDOWS-Code der App würden sonst nur im vollen Build
        # übersetzt; dank EnableWindowsTargeting geht das auch unter Linux. Läuft auch nach roten Tests, damit beide
        # Fehler sichtbar werden.
        if: ${{ !cancelled() }}
        run: dotnet build tests/Lupe.Tests -c Release -f net10.0-windows10.0.19041.0

      - name: Testergebnisse
        if: always()
        # Ein Upload-Problem (z. B. voller Artifact-Speicher) soll Publish und Release nicht blockieren
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: Testergebnisse-linux
          path: TestResults/*.trx
          if-no-files-found: ignore
          retention-days: 3

      - name: Publish und Pakete
        if: needs.gate.outputs.full == 'true'
        run: |
          v='${{ needs.version.outputs.version }}'
          for arch in x64 arm64; do
            # libZXing.so aus dem Job zxing (glibc 2.28) statt aus dem NuGet-Paket (glibc 2.38)
            dotnet publish src/Lupe/Lupe.csproj -c Release -r linux-$arch --self-contained true "-p:Version=$v" -p:FileVersion=${{ needs.version.outputs.file }} -p:DebugType=none "-p:LupeZXingDir=$PWD/zxing" -o out/linux-$arch
            packaging/linux/package.sh out/linux-$arch $arch "$v" dist '${{ needs.version.outputs.suffix }}'
          done
          ls -l dist

      - name: Pakete prüfen
        if: needs.gate.outputs.full == 'true'
        run: |
          dpkg-deb --info dist/*.deb
          test "$(dpkg-deb --field dist/*.deb Package)" = ictbaden-lupe
          tar -tzf dist/Lupe*-linux-x64.tar.gz | grep -E '^lupe/(Lupe|lupe.desktop|install.sh|lupe.png|libZXing.so|libSkiaSharp.so)$'
          dpkg-deb --field dist/*.deb Depends | grep -E 'libc6 \(>= 2\.[0-9]+\)'
          mkdir -p /tmp/lupe-probe && tar -xzf dist/Lupe*-linux-x64.tar.gz -C /tmp/lupe-probe
          /tmp/lupe-probe/lupe/Lupe --hilfe | head -n 3
          # Die ausgelieferten Bibliotheken laden auf älteren Systemen (glibc, libstdc++), libZXing.so ist die selbst gebaute
          for arch in x64 arm64; do
            cmp zxing/linux-$arch/libZXing.so out/linux-$arch/libZXing.so
            packaging/check-natives.sh linux-$arch out/linux-$arch
            python3 packaging/check-notices.py out/linux-$arch/Lupe.deps.json out/linux-$arch
          done

      - name: SBOM (Stückliste aller Pakete)
        if: needs.gate.outputs.full == 'true'
        run: |
          # deps.json aller Plattformen (Windows und macOS nur veröffentlicht, nicht gepackt), dazu zxing-cpp und .NET
          v='${{ needs.version.outputs.version }}'
          for rid in win-x64 osx-arm64; do
            dotnet publish src/Lupe/Lupe.csproj -c Release -r $rid --self-contained true -p:DebugType=none -o "$RUNNER_TEMP/sbom-$rid" > /dev/null
          done
          python3 packaging/sbom.py "$v" out/linux-x64/Lupe.deps.json out/linux-arm64/Lupe.deps.json \
            "$RUNNER_TEMP/sbom-win-x64/Lupe.deps.json" "$RUNNER_TEMP/sbom-osx-arm64/Lupe.deps.json" > "dist/Lupe${{ needs.version.outputs.suffix }}-sbom.cdx.json"
          python3 -c "import json,sys; b=json.load(open(sys.argv[1])); print(len(b['components']), 'Bestandteile')" dist/Lupe*-sbom.cdx.json

      - name: Rauchtest auf älteren Systemen (x64)
        if: needs.gate.outputs.full == 'true'
        timeout-minutes: 15
        run: |
          # .deb auf Ubuntu 22.04 (apt holt die Abhängigkeiten), tar.gz auf Ubuntu 20.04 (glibc 2.31) und Debian 12
          docker run --rm -v "$PWD/dist:/dist:ro" -v "$PWD/packaging:/p:ro" ubuntu:22.04 sh -c \
            'export DEBIAN_FRONTEND=noninteractive; apt-get update -qq && apt-get install -y -qq /dist/lupe_*amd64.deb >/dev/null && /p/smoke.sh lupe'
          for image in ubuntu:20.04 debian:12; do
            echo "== $image"
            docker run --rm -v "$PWD/dist:/dist:ro" -v "$PWD/packaging:/p:ro" "$image" sh -c \
              'export DEBIAN_FRONTEND=noninteractive; apt-get update -qq && apt-get install -y -qq --no-install-recommends libfontconfig1 $(apt-cache search --names-only "^libicu[0-9]+$" | cut -d" " -f1 | head -n 1) >/dev/null && tar -xzf /dist/Lupe*-linux-x64.tar.gz -C /tmp && /p/smoke.sh /tmp/lupe/Lupe'
          done

      - uses: actions/upload-artifact@v7
        if: needs.gate.outputs.full == 'true'
        with:
          name: Pakete-linux
          path: dist/*
          if-no-files-found: error
          # Der Release-Job holt sie sofort ab; länger aufbewahrt sprengen sie den Artifact-Speicher (Free-Plan: 500 MB)
          retention-days: 1

  linux-arm64-rauchtest:
    needs: [gate, linux]
    if: needs.gate.outputs.full == 'true'
    runs-on: ubuntu-24.04-arm
    # Ein hängender Schritt soll nicht bis zum GitHub-Limit von 6 Stunden laufen
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: Pakete-linux
          path: dist

      - name: Rauchtest auf älteren Systemen (arm64)
        timeout-minutes: 15
        run: |
          for image in ubuntu:20.04 debian:12; do
            echo "== $image"
            docker run --rm -v "$PWD/dist:/dist:ro" -v "$PWD/packaging:/p:ro" "$image" sh -c \
              'export DEBIAN_FRONTEND=noninteractive; apt-get update -qq && apt-get install -y -qq --no-install-recommends libfontconfig1 $(apt-cache search --names-only "^libicu[0-9]+$" | cut -d" " -f1 | head -n 1) >/dev/null && tar -xzf /dist/Lupe*-linux-arm64.tar.gz -C /tmp && /p/smoke.sh /tmp/lupe/Lupe'
          done

  macos:
    needs: [gate, version, zxing-macos]
    if: needs.gate.outputs.full == 'true'
    runs-on: macos-latest
    # Ein hängender Schritt soll nicht bis zum GitHub-Limit von 6 Stunden laufen
    # Build, bis zu 20 min Tests, zweimal Publish mit Signieren und bis zu 2 × 30 min Notarisierung
    timeout-minutes: 120
    outputs:
      notarized: ${{ steps.signing.outputs.notarize }}
    steps:
      - uses: actions/checkout@v7

      - name: Signieren und Notarisieren eingerichtet?
        id: signing
        # Developer-ID-Signatur und Notarisierung nur, wenn die Organisation die Zugangsdaten hinterlegt hat (Apple Developer
        # Program, siehe docs/development.md) und nicht bei Pull Requests. Bis dahin ad hoc signiert wie bisher. Halbe
        # Angaben brechen den Lauf nicht ab (sonst bliebe „latest“ stehen), sondern fallen mit Warnung zurück:
        # MACOS_SIGN braucht Zertifikat, Passwort und Identität, MACOS_NOTARIZE zusätzlich alle drei Notar-Angaben.
        env:
          P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
          EVENT: ${{ github.event_name }}
        run: |
          sign=false; notarize=false
          if [ "$EVENT" != pull_request ] && [ -n "$P12" ]; then
            if [ -n "$CERT_PASSWORD" ] && [ -n "$IDENTITY" ]; then sign=true
            else echo "::warning::MACOS_CERTIFICATE_P12 ist gesetzt, MACOS_CERTIFICATE_PASSWORD oder MACOS_SIGN_IDENTITY fehlt – Lupe.app wird nur ad hoc signiert."; fi
          fi
          if [ "$sign" = true ]; then
            if [ -n "$APPLE_ID" ] && [ -n "$TEAM_ID" ] && [ -n "$NOTARY_PASSWORD" ]; then notarize=true
            else echo "::warning::MACOS_NOTARY_APPLE_ID, MACOS_NOTARY_TEAM_ID oder MACOS_NOTARY_PASSWORD fehlt – Lupe.app wird signiert, aber nicht notarisiert (Gatekeeper fragt dann wie bisher)."; fi
          fi
          echo "Developer ID: $sign, Notarisierung: $notarize"
          echo "MACOS_SIGN=$sign" >> "$GITHUB_ENV"
          echo "MACOS_NOTARIZE=$notarize" >> "$GITHUB_ENV"
          echo "notarize=$notarize" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/download-artifact@v8
        with:
          name: zxing-macos
          path: zxing

      - name: Build
        run: dotnet build tests/Lupe.Tests -c Release -f net10.0

      - name: Tests
        timeout-minutes: 20
        # --blame-hang-timeout: ein hängender Test (z. B. eine Systemabfrage, die auf eine Erlaubnis wartet) bricht ab und wird benannt
        run: dotnet test tests/Lupe.Tests -c Release -f net10.0 --no-build --blame-hang-timeout 4m --blame-hang-dump-type none --logger "console;verbosity=normal" --logger "trx;LogFileName=tests-macos.trx" --results-directory TestResults

      - name: Testergebnisse
        if: always()
        # Ein Upload-Problem (z. B. voller Artifact-Speicher) soll Publish und Release nicht blockieren
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: Testergebnisse-macos
          path: TestResults/*.trx
          if-no-files-found: ignore
          retention-days: 3

      - name: Signierzertifikat in einen eigenen Schlüsselbund
        if: env.MACOS_SIGN == 'true'
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/lupe-signing.keychain-db"
          password=$(openssl rand -base64 24)
          echo "$MACOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/lupe.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/lupe.p12" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/lupe.p12"

      - name: Publish und Lupe.app
        timeout-minutes: 75
        env:
          # Leer = ad hoc signiert (package.sh); sonst Developer ID mit Hardened Runtime und, mit den Notar-Angaben, notarisiert
          MACOS_SIGN_IDENTITY: ${{ env.MACOS_SIGN == 'true' && secrets.MACOS_SIGN_IDENTITY || '' }}
          MACOS_NOTARY_APPLE_ID: ${{ env.MACOS_NOTARIZE == 'true' && secrets.MACOS_NOTARY_APPLE_ID || '' }}
          MACOS_NOTARY_TEAM_ID: ${{ env.MACOS_NOTARIZE == 'true' && secrets.MACOS_NOTARY_TEAM_ID || '' }}
          MACOS_NOTARY_PASSWORD: ${{ env.MACOS_NOTARIZE == 'true' && secrets.MACOS_NOTARY_PASSWORD || '' }}
        run: |
          v='${{ needs.version.outputs.version }}'
          for arch in arm64 x64; do
            # libZXing.dylib aus dem Job zxing (ab macOS 12) statt aus dem NuGet-Paket (macOS 26 bzw. 15)
            dotnet publish src/Lupe/Lupe.csproj -c Release -r osx-$arch --self-contained true "-p:Version=$v" -p:FileVersion=${{ needs.version.outputs.file }} -p:DebugType=none "-p:LupeZXingDir=$PWD/zxing" -o out/osx-$arch
            packaging/macos/package.sh out/osx-$arch $arch "$v" dist '${{ needs.version.outputs.suffix }}'
          done
          ls -l dist

      - name: Lupe.app prüfen
        timeout-minutes: 15
        run: |
          for arch in arm64 x64; do
            mkdir -p /tmp/lupe-probe-$arch && ditto -x -k dist/Lupe*-macos-$arch.zip /tmp/lupe-probe-$arch
            app=/tmp/lupe-probe-$arch/Lupe.app
            plutil -p $app/Contents/Info.plist | grep -E 'NSCameraUsageDescription|LSMinimumSystemVersion|CFBundleVersion'
            codesign --verify --deep --strict $app
            cmp zxing/osx-$arch/libZXing.dylib out/osx-$arch/libZXing.dylib
            # Ohne libLupeCamera.dylib (Swift-Helfer) findet Lupe still keine Kamera; check-natives.sh verlangt keine bestimmte Datei
            test -f $app/Contents/MacOS/libLupeCamera.dylib || { echo "::error::libLupeCamera.dylib fehlt in Lupe.app ($arch)"; exit 1; }
            lipo -archs $app/Contents/MacOS/libLupeCamera.dylib | grep -q arm64 && lipo -archs $app/Contents/MacOS/libLupeCamera.dylib | grep -q x86_64 \
              || { echo "::error::libLupeCamera.dylib in Lupe.app ($arch) ist nicht universal (arm64 und x86_64)"; exit 1; }
            # Keine mitgelieferte Bibliothek verlangt ein neueres macOS als LSMinimumSystemVersion
            rid=osx-$arch; packaging/check-natives.sh $rid $app/Contents/MacOS
            python3 packaging/check-notices.py out/osx-$arch/Lupe.deps.json out/osx-$arch
          done
          /tmp/lupe-probe-arm64/Lupe.app/Contents/MacOS/Lupe --hilfe | head -n 3
          packaging/smoke.sh /tmp/lupe-probe-arm64/Lupe.app/Contents/MacOS/Lupe
          # Intel-Fassung unter Rosetta, wenn der Runner es hat
          if arch -x86_64 /usr/bin/true 2>/dev/null; then
            packaging/smoke.sh /tmp/lupe-probe-x64/Lupe.app/Contents/MacOS/Lupe
          else
            echo "Rosetta fehlt – Rauchtest der Intel-Fassung übersprungen"
          fi
          # Developer ID mit Hardened Runtime; Gatekeeper und Ticket nur, wenn auch notarisiert wurde
          if [ "$MACOS_SIGN" = true ]; then
            for arch in arm64 x64; do
              details=$(codesign -dvv /tmp/lupe-probe-$arch/Lupe.app 2>&1)
              echo "$details" | grep -q '^Authority=Developer ID Application:' || { echo "::error::Lupe.app ($arch) ist nicht mit der Developer ID signiert."; echo "$details"; exit 1; }
              echo "$details" | grep -q 'flags=.*runtime' || { echo "::error::Lupe.app ($arch) ohne Hardened Runtime."; echo "$details"; exit 1; }
            done
          fi
          if [ "$MACOS_NOTARIZE" = true ]; then
            for arch in arm64 x64; do
              spctl --assess --type execute -vv /tmp/lupe-probe-$arch/Lupe.app
              xcrun stapler validate /tmp/lupe-probe-$arch/Lupe.app
            done
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: Pakete-macos
          path: dist/*
          if-no-files-found: error
          # Der Release-Job holt sie sofort ab; länger aufbewahrt sprengen sie den Artifact-Speicher (Free-Plan: 500 MB)
          retention-days: 1

  # Nur nach einem vollen Build: Ein Nur-Linux-Lauf darf kein Release anlegen oder halb aktualisieren
  release:
    needs: [gate, version, windows, linux, linux-arm64-rauchtest, macos]
    if: needs.gate.outputs.full == 'true' && github.event_name != 'pull_request' && (github.ref_type == 'tag' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    # Ein hängender Schritt soll nicht bis zum GitHub-Limit von 6 Stunden laufen
    timeout-minutes: 20
    permissions:
      contents: write # für die Releases
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: Pakete-*
          path: dist
          merge-multiple: true

      - name: Prüfsummen
        shell: pwsh
        run: |
          # Über alle Dateien aus den drei Jobs, nach dem Signieren (Windows-Job), sonst stimmen die Summen nicht
          Get-ChildItem dist -File | Where-Object Name -ne 'SHA256SUMS.txt' | Sort-Object Name | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content -Encoding ascii dist/SHA256SUMS.txt
          Get-Content dist/SHA256SUMS.txt

      - name: Dateien
        run: ls -l dist

      - name: Release erstellen (nur bei Tag v*)
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          SUFFIX: ${{ needs.version.outputs.suffix }}
          NOTARIZED: ${{ needs.macos.outputs.notarized }}
        shell: pwsh
        run: |
          # v1.0.0-rc1 und ähnliche: Vorabversion, nicht „Latest“
          # @( if … ): Ein if gibt ein Array mit einem Element als Text zurück, @pre zerlegte ihn dann in Zeichen
          $pre = @(if ($env:GITHUB_REF_NAME -match '-') { '--prerelease' })
          $notes = ./.github/scripts/release-notes.ps1 -Tag $env:GITHUB_REF_NAME -Version $env:VERSION `
            -Suffix $env:SUFFIX -Signed ($env:SIGN -eq 'true') -Notarized ($env:NOTARIZED -eq 'true')
          gh release create $env:GITHUB_REF_NAME (Get-ChildItem dist/*).FullName --title "Lupe $env:GITHUB_REF_NAME" --notes $notes @pre
          if ($LASTEXITCODE -ne 0) { throw "gh release create ist fehlgeschlagen (Exit $LASTEXITCODE)." }
          # Das rollierende „latest“ wird gleich zur Vorabversion (sonst erst beim nächsten Push auf main), das Tag-Release
          # bekommt den Platz in der Seitenleiste
          if (-not $pre) {
            gh release edit $env:GITHUB_REF_NAME --latest
            if ($LASTEXITCODE -ne 0) { Write-Host "::warning::$env:GITHUB_REF_NAME ließ sich nicht als Latest markieren." }
            gh release view latest *> $null
            if ($LASTEXITCODE -eq 0) {
              gh release edit latest --prerelease --latest=false
              if ($LASTEXITCODE -ne 0) { Write-Host "::warning::'latest' ließ sich nicht zur Vorabversion machen." }
            }
            $global:LASTEXITCODE = 0
          }

      - name: "Release 'latest' aktualisieren (main)"
        # Nachtlauf, von Hand oder [voll]-Push; das Skript setzt den Tag 'latest' auf den gebauten Commit (Vergleich in gate)
        if: needs.gate.outputs.full == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          NOTARIZED: ${{ needs.macos.outputs.notarized }}
        shell: pwsh
        run: |
          # Rollierendes Release: immer der neueste main-Stand, unter festen Links. Wird an Ort und Stelle
          # aktualisiert (kein Löschen und Neuanlegen), Vorabversion erst, wenn es Releases aus Tags gibt – Einzelheiten im Skript.
          $notes = ./.github/scripts/release-notes.ps1 -Tag latest -Version $env:VERSION -Signed ($env:SIGN -eq 'true') -Notarized ($env:NOTARIZED -eq 'true')
          $expected = 'SHA256SUMS.txt', 'Lupe-x64.msi', 'Lupe.exe', 'Lupe-win-x64-framework.zip', 'lupe_amd64.deb', 'Lupe-linux-x64.tar.gz',
                      'Lupe-linux-arm64.tar.gz', 'Lupe-macos-arm64.zip', 'Lupe-macos-x64.zip', 'Lupe-sbom.cdx.json'
          # Die Version im Titel: GitHub zeigt beim Release das Datum der ersten Veröffentlichung, nicht das des Builds
          ./.github/scripts/release-latest.ps1 -Notes $notes -Title "Latest Build (main) – ${{ needs.version.outputs.version }}" -Expected $expected
